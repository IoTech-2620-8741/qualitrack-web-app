<main class="operations-page">
  <app-page-header
    icon="policy"
    titleKey="audit-log.title"
    [tabs]="tabs"
    activeTab="/reports/audit-log"
    [loading]="store.isLoading()"
    (refresh)="onSearch(lastQuery())"
  >
    <div class="reports">
      <!-- The equipment, the batch and the dates the log is narrowed to -->
      <app-list-toolbar [searchKey]="null" [activeFilters]="activeFilters()">
        <app-audit-log-filters toolbarMore [loading]="store.isLoading()" (search)="onSearch($event)" (clear)="onClear()" />
      </app-list-toolbar>

      @if (store.error()) {
        <app-error-banner [messageKey]="store.error()!" />
      }

      <app-audit-log-table [rows]="rows()" [loading]="store.isLoading()" />
    </div>
  </app-page-header>
</main>
