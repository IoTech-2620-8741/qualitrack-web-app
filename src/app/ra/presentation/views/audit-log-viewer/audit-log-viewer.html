<div class="viewer-container">
  <div class="section-header">
    <div class="title-group">
      <mat-icon class="title-icon">policy</mat-icon>
      <h2>{{ 'audit-log.title' | translate }}</h2>
    </div>
  </div>

  <app-audit-log-filters [loading]="store.isLoading()" (search)="onSearch($event)" (clear)="onClear()" />

  @if (store.error()) {
    <app-error-banner [messageKey]="store.error()!" />
  }

  <div class="table-card mat-elevation-z2">
    <app-audit-log-table [rows]="rows()" [loading]="store.isLoading()" />
  </div>
</div>
