<main class="operations-page">
  <header class="page-heading">
    <h1>
      <mat-icon aria-hidden="true">policy</mat-icon>
      {{ 'audit-log.title' | translate }}
    </h1>
  </header>

  <app-audit-log-filters [loading]="store.isLoading()" (search)="onSearch($event)" (clear)="onClear()" />

  @if (store.error()) {
    <app-error-banner [messageKey]="store.error()!" />
  }

  <app-audit-log-table [rows]="rows()" [loading]="store.isLoading()" />
</main>
