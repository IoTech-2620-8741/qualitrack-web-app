<div class="generator-container">
  <div class="page-header">
    <div class="breadcrumbs">{{ 'report-generator.breadcrumbs' | translate }}</div>
    <h1 class="page-title">{{ 'report-generator.title' | translate }}</h1>
    <p class="page-desc">{{ 'report-generator.subtitle' | translate }}</p>
  </div>

  @if (store.error()) {
    <app-error-banner [messageKey]="store.error()!" [dismissible]="true" (dismiss)="store.clearMessages()" />
  }

  <div class="layout-grid" [class.loading-blur]="store.isLoading()">
    <!-- Componente Izquierdo -->
    <div class="sidebar">
      <app-report-type-selector />
    </div>

    <!-- Componente Derecho -->
    <div class="main-panel">
      <app-report-params-form />
    </div>
  </div>

  @if (store.isLoading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="50"></mat-spinner>
      <p>{{ 'report-generator.generating' | translate }}</p>
    </div>
  }
</div>
