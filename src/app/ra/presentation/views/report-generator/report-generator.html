<div class="generator-container">
  <div class="page-header">
    <h1 class="page-title">
      <mat-icon aria-hidden="true">summarize</mat-icon>
      {{ 'report-generator.title' | translate }}
    </h1>
    <p class="page-desc">{{ 'report-generator.subtitle' | translate }}</p>
  </div>

  @if (store.error()) {
    <app-error-banner [messageKey]="store.error()!" [dismissible]="true" (dismiss)="store.clearMessages()" />
  }

  @if (store.successMsg()) {
    <div class="success-message" role="status">
      <mat-icon aria-hidden="true">check_circle</mat-icon>
      <span class="message">{{ store.successMsg()! | translate }}</span>
      <button mat-icon-button type="button" (click)="store.clearMessages()"
              [attr.aria-label]="'common.close' | translate">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
  }

  <div class="layout-grid" [class.loading-blur]="store.isLoading()">
    <div class="sidebar">
      <app-report-type-selector />
    </div>

    <div class="main-panel">
      <app-report-params-form />
    </div>
  </div>

  @if (store.isLoading()) {
    <div class="loading-overlay" role="status">
      <mat-spinner diameter="50"></mat-spinner>
      <p>{{ 'report-generator.generating' | translate }}</p>
    </div>
  }
</div>
