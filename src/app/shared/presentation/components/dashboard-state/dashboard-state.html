@if (state() === 'loading') {
  <div class="state" role="status">
    <mat-spinner diameter="24" />{{ 'dashboard.overview.loading' | translate }}
  </div>
} @else if (state() === 'error') {
  <div class="state error" role="status">
    <mat-icon>cloud_off</mat-icon>
    <span>{{ 'dashboard.overview.load-error' | translate }}</span>
    <button
      mat-icon-button
      (click)="retry.emit()"
      [matTooltip]="'dashboard.overview.refresh' | translate"
      [attr.aria-label]="'dashboard.overview.refresh' | translate"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
}
