@if (store.isSignedIn()) {
  <div class="user-session">
    <ng-template #identity>
      <span class="user-avatar" aria-hidden="true">
        @if (profile.photoUrl(); as photo) {
          <img [src]="photo" alt="">
        } @else {
          {{ profile.initials() }}
        }
      </span>

      <span class="user-copy">
        <span class="user-name">{{ profile.displayName() }}</span>
        @if (roleKey(); as key) {
          <span class="user-role">{{ key | translate }}</span>
        }
      </span>
    </ng-template>

    @if (canOpenProfile()) {
      <a class="user-identity" routerLink="/profile" [matTooltip]="'profile.open' | translate"
        [attr.aria-label]="'profile.open-named' | translate: { name: profile.displayName() }">
        <ng-container [ngTemplateOutlet]="identity" />
      </a>
    } @else {
      <span class="user-identity">
        <ng-container [ngTemplateOutlet]="identity" />
      </span>
    }

    <button
      mat-icon-button
      type="button"
      class="sign-out-button"
      [matTooltip]="'profile.sign-out' | translate"
      [attr.aria-label]="'profile.sign-out' | translate"
      (click)="signOut()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
}
