<section class="filters" [attr.aria-label]="'batches.filters.label' | translate">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search">
    <mat-label>{{ 'batches.filters.search' | translate }}</mat-label>
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
    <input
      matInput
      type="search"
      [value]="filter().search"
      (input)="patch({ search: $any($event.target).value })"
    />
  </mat-form-field>

  <div class="environment">
    <app-environment-selector
      class="full-width"
      allOptionKey="environments.all"
      [environments]="environments()"
      [selectedId]="filter().environmentId"
      (selectedChange)="patch({ environmentId: $event })"
      (allSelected)="patch({ environmentId: null })"
    />
  </div>

  <!-- Start period, chosen in the calendar -->
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="period">
    <mat-label>{{ 'batches.filters.period' | translate }}</mat-label>
    <mat-date-range-input [rangePicker]="picker">
      <input
        matStartDate
        readonly
        [value]="from()"
        [placeholder]="'batches.filters.from' | translate"
        (click)="picker.open()"
        (keydown.alt.arrowdown)="picker.open()"
        (dateChange)="chooseDay('from', $event.value)"
      />
      <input
        matEndDate
        readonly
        [value]="to()"
        [placeholder]="'batches.filters.to' | translate"
        (click)="picker.open()"
        (keydown.alt.arrowdown)="picker.open()"
        (dateChange)="chooseDay('to', $event.value)"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
    <mat-date-range-picker #picker />
  </mat-form-field>

  @if (applied()) {
    <button mat-stroked-button type="button" class="clear" (click)="cleared.emit()">
      <mat-icon aria-hidden="true">filter_alt_off</mat-icon>
      {{ 'batches.filters.clear' | translate }}
    </button>
  }
</section>
