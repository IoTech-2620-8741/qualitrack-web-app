<main class="operations-page">
  <app-page-header
    icon="list_alt"
    titleKey="batches.title"
    [tabs]="tabs"
    activeTab="/batches"
    [loading]="store.isLoading()"
    (refresh)="refresh()"
  >
    <div class="batches">
      @if (store.error()) {
        <p class="error" role="alert">{{ store.error()! | translate }}</p>
      }

      @if (store.batches().length) {
        <!-- The environment, then the batches of each status with their counts, the search and the period -->
        <app-list-toolbar
          searchKey="batches.filters.search"
          [search]="filter().search"
          [activeFilters]="activeFilters()"
          (searchChange)="patchFilter({ search: $event })"
        >
          <app-environment-selector
            toolbarContext
            appearance="inline"
            allOptionKey="environments.all"
            [environments]="environments()"
            [selectedId]="filter().environmentId"
            (selectedChange)="patchFilter({ environmentId: $event })"
            (allSelected)="patchFilter({ environmentId: null })"
          />
          <app-batch-kpi-cards
            toolbarFilters
            [batches]="inContext()"
            [selected]="filter().status"
            (statusSelected)="chooseStatus($event)"
          />
          <app-batch-filters
            toolbarMore
            [filter]="filter()"
            (filterChange)="filter.set($event)"
            (cleared)="clearFilters()"
          />
        </app-list-toolbar>

        @if (filtered().length) {
          <!-- Table of batches with sorting and pagination -->
          <app-batch-table [batches]="filtered()" [environments]="store.environments()" />
        } @else {
          <div class="empty-card">
            <app-empty-state
              icon="filter_alt_off"
              titleKey="batches.empty-state.no-match-title"
              messageKey="batches.empty-state.no-match-message"
            >
              <button mat-stroked-button type="button" (click)="clearFilters()">
                {{ 'batches.filters.clear' | translate }}
              </button>
            </app-empty-state>
          </div>
        }
      } @else if (store.isLoading()) {
        <div class="loading" role="status">
          <mat-spinner diameter="40" [attr.aria-label]="'common.status-loading' | translate" />
        </div>
      } @else if (!store.error()) {
        <div class="empty-card">
          <app-empty-state
            icon="inventory_2"
            titleKey="batches.empty-state.none-title"
            messageKey="batches.empty-state.none-message"
          >
            <a mat-stroked-button routerLink="/batches/environments">
              <mat-icon aria-hidden="true">factory</mat-icon>
              {{ 'product-catalog.title' | translate }}
            </a>
          </app-empty-state>
        </div>
      }
    </div>
  </app-page-header>
</main>
