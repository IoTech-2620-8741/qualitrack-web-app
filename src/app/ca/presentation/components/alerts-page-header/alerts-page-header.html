<header class="page-header">
  <div class="heading">
    <h1>
      <mat-icon aria-hidden="true">notifications_active</mat-icon>
      {{ 'ca-alerts.page.title' | translate }}
    </h1>
    <div class="actions">
      <ng-content />
    </div>
  </div>

  <nav
    mat-tab-nav-bar
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    [tabPanel]="sectionPanel"
    [attr.aria-label]="'ca-alerts.page.sections' | translate"
  >
    <a
      mat-tab-link
      routerLink="/alerts"
      [queryParams]="tabQueryParams()"
      [active]="section() === 'active'"
    >
      {{ 'ca-alerts.tabs.active' | translate }}
      @if (activeCount(); as activeCount) {
        <span class="tab-count">{{ activeCount }}</span>
      }
    </a>
    <a
      mat-tab-link
      routerLink="/alerts/history"
      [queryParams]="tabQueryParams()"
      [active]="section() === 'history'"
    >
      {{ 'ca-alerts.tabs.history' | translate }}
    </a>
    <a
      mat-tab-link
      routerLink="/alerts/notification-settings"
      [active]="section() === 'preferences'"
    >
      {{ 'ca-alerts.tabs.preferences' | translate }}
    </a>
  </nav>
</header>
<mat-tab-nav-panel #sectionPanel>
  <ng-content select="[alertsSection]" />
</mat-tab-nav-panel>
